# 宿主端口可用环境变量覆盖：WEB_PORT=9000 API_PORT=9001 docker compose up
services:
  api:
    build: ./api
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 12

  # 一次性验收服务：跑完 pytest + Vitest + Playwright 后退出
  verify:
    build:
      context: .
      dockerfile: verify/Dockerfile
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      API_BASE: http://api:8000
      BASE_URL: http://web
